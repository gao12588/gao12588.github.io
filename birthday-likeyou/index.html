</style><script>document.addEventListener('DOMContentLoaded',()=>{const heart=document.querySelector('.paper-heart'),note=heart.querySelector('.heart-note');heart.querySelectorAll('.paper-piece').forEach(p=>p.remove());const wishes=['生日快乐','平安喜乐','万事顺意','闪闪发光','自由热烈','快乐常在','心想事成','被爱包围','勇敢追梦','日日晴朗','温柔坚定','保持热爱','好运连连','笑容灿烂','前程似锦','岁岁欢喜'];for(let row=0;row<6;row++)for(let col=0;col<8;col++){const p=document.createElement('i');p.className='paper-piece';p.textContent=wishes[(row*8+col)%wishes.length];p.style.setProperty('--left',col*12.5+'%');p.style.setProperty('--top',row*16.667+'%');p.style.setProperty('--paper',['#fffaf3','#f9f1ef','#fffefd','#f8e9e9','#f3f1eb'][(row*7+col)%5]);p.style.setProperty('--fly-x',((col-3.5)*39+(col%2?90:-90))+'vw');p.style.setProperty('--fly-y',((row-2.5)*28+(row%2?75:-75))+'vh');p.style.setProperty('--spin',((row*37+col*19)%180-90)+'deg');p.style.setProperty('--delay',(Math.abs(col-3.5)*.13+Math.abs(row-2.5)*.1)+'s');p.style.setProperty('--time',(1.4+(row+col)%4*.16)+'s');heart.insertBefore(p,note)}})</script></head><body><main>
<section id="opening" class="scene active"><div class="lines"></div><i class="float a">♥</i><i class="float b">♥</i><i class="float c">♥</i><div class="opening-copy"><small>FOR ZHAO XIUNING · A SMALL SURPRISE</small><h1>生日快乐</h1><em>Happy Birthday</em><div class="paper-heart"><span class="heart-note"><b>赵秀宁</b>愿快乐如期而至</span></div><button class="open" id="open">打开这份生日礼物</button><p class="tap">轻轻点一下</p></div></section>
<section id="cards" class="scene"><div class="wall"><i class="mini">今天是特别的一天</i><i class="mini">愿你永远热烈</i><i class="mini">把喜欢的事做好</i><i class="mini">快乐不止生日</i><i class="mini">想见的人都能见到</i><i class="mini">新的故事正发生</i><i class="mini">愿望慢慢实现</i><i class="mini">一切都有回音</i><i class="mini">有爱也有自由</i><i class="mini">平安顺遂</i><i class="mini">被世界温柔对待</i></div><article class="letter"><p>愿你在新的一岁，仍然敢于热爱，也不急着证明自己。愿每一次出发都带着底气，每一段平常的日子都有值得记住的小光亮。</p><p class="stamp">生日快乐，赵秀宁</p><button class="next" id="toCake">再收下一份祝福</button></article></section>
<section id="cake" class="scene"><div class="nebula"></div><div class="stream"></div><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i><i class="orb o5"></i><i class="orb o6"></i><div class="copy"><h2>把星河，<br>送给你。</h2><p>把所有闪耀的祝福，<br>都放进这一刻的烛光里。</p><strong>祝你生日快乐</strong></div><div class="glass" id="cakeObj"><button class="blow" id="blow" aria-label="点击蜡烛许愿"></button><div class="candle"><div class="flame"></div></div><div class="frost"></div><div class="upper"></div><div class="base"></div><div class="plate"></div><span class="wish">愿望已抵达 ✦</span><span class="hint">点一下蜡烛，许个愿吧</span></div><button class="restart" id="restart">重看一遍</button></section>
</main><script>(()=>{const heart=document.querySelector('.paper-heart'),note=heart.querySelector('.heart-note');for(let row=0;row<10;row++)for(let col=0;col<12;col++){const p=document.createElement('i');p.className='paper-piece';p.style.setProperty('--left',col*8.333+'%');p.style.setProperty('--top',row*10+'%');p.style.setProperty('--paper',['#fffaf3','#f9f1ef','#fffefd','#f8e9e9','#f3f1eb'][(row*7+col)%5]);p.style.setProperty('--fly-x',((col-5.5)*31+(col%2?95:-95))+'vw');p.style.setProperty('--fly-y',((row-4.5)*23+(row%2?80:-80))+'vh');p.style.setProperty('--spin',((row*37+col*19)%180-90)+'deg');p.style.setProperty('--delay',(Math.abs(col-5.5)*.09+Math.abs(row-4.5)*.07)+'s');p.style.setProperty('--time',(1.35+(row+col)%4*.15)+'s');heart.insertBefore(p,note)}})();</script><script>(()=>{const wall=document.querySelector('.wall'),cake=document.querySelector('#cake'),words=['愿所有美好如期而至','生日快乐','今天你最大','新的一岁平安喜乐','未来可期','笑容常在','所有心愿都实现','去看更大的世界','愿你被温柔以待','闪闪发光'];for(let i=0;i<88;i++){let n=document.createElement('i');n.className='extra-note';n.textContent=words[i%words.length];n.style.setProperty('--w',65+i%4*16+'px');n.style.setProperty('--h',38+i%3*9+'px');n.style.setProperty('--x',(i*37%101)+'%');n.style.setProperty('--y',(i*61%103)+'%');n.style.setProperty('--rot',(i*17%19-9)+'deg');n.style.setProperty('--delay',(i%14)*.045+'s');n.style.setProperty('--bg',['#f5dce4','#e4e8ff','#e5f5ed','#fff2d9','#f9e9fa','#e1f2f9'][i%6]);wall.append(n)}for(let i=0;i<6;i++){let s=document.createElement('i');s.className='starsweep';s.style.setProperty('--x',(8+i*18)+'%');s.style.setProperty('--y',(12+i*13)%85+'%');s.style.setProperty('--delay',-i*.43+'s');cake.append(s)}})();</script><script>(()=>{const $=x=>document.querySelector(x),cake=$('#cake'),cakeObj=$('#cakeObj');let timer;const show=id=>{clearTimeout(timer);document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='cards')timer=setTimeout(()=>show('cake'),5800)};document.querySelectorAll('.mini').forEach((n,i)=>n.style.setProperty('--i',i));for(let i=0;i<95;i++){const p=document.createElement('i');p.className='spark';p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--y',Math.random()*100+'%');p.style.setProperty('--s',2+Math.random()*14+'px');p.style.setProperty('--d',2+Math.random()*5+'s');p.style.setProperty('--dx',Math.random()*50-25+'px');p.style.setProperty('--dy',Math.random()*50-25+'px');p.style.setProperty('--c',['#ffc954','#da57ef','#40c4ff','#ff7797','#fff'][i%5]);cake.append(p)}const orbit=document.createElement('i');orbit.className='orbit';cakeObj.append(orbit);const notes=['生日快乐','愿你如愿','今天要开心','平安喜乐','星河予你'];notes.forEach((t,i)=>{const n=document.createElement('i');n.className='fly-note';n.textContent=t;n.style.left=25+i%3*19+'%';n.style.top=32+i%2*13+'%';n.style.setProperty('--delay',.7+i*.35+'s');n.style.setProperty('--from-x',i%2?'-80vw':'80vw');n.style.setProperty('--from-y',i%2?'20vh':'-40vh');n.style.setProperty('--to-x',(i-2)*35+'px');n.style.setProperty('--to-y',i%2?'-60px':'40px');n.style.setProperty('--angle',i%2?'12deg':'-8deg');$('#opening').append(n)});$('#open').onclick=()=>show('cards');$('#toCake').onclick=()=>show('cake');$('#restart').onclick=()=>{cakeObj.classList.remove('blown');show('opening')};$('#blow').onclick=()=>{if(cakeObj.classList.contains('blown'))return;cakeObj.classList.add('blown');for(let i=0;i<110;i++){const p=document.createElement('i');p.className='conf';p.style.setProperty('--c',['#ffdb4a','#ec5aa7','#66dcff','#b17bff','#fff'][i%5]);p.style.setProperty('--x',40+Math.random()*22+'vw');p.style.setProperty('--dx',-240+Math.random()*480+'px');p.style.setProperty('--t',1.5+Math.random()*1.9+'s');cake.append(p);setTimeout(()=>p.remove(),3700)}}})();</script></body></html>
